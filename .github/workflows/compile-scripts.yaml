name: Powershell Compiler

on:
  push:
    branches: [master]
    paths:
      - "src/**/*.ps1"
      - "src/**/*.psm1"
      - "src/AMT.PowerShell.Common/**"
      - ".github/workflows/compile-scripts.yaml"
  pull_request:
    paths:
      - "src/**/*.ps1"
      - "src/**/*.psm1"
      - "src/AMT.PowerShell.Common/**"
      - ".github/workflows/compile-scripts.yaml"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      compiled: ${{ steps.changes.outputs.compiled }}
      src: ${{ steps.changes.outputs.src }}
      src_deleted: ${{ steps.changes.outputs.src_deleted }}
      module: ${{ steps.changes.outputs.module }}
      module_deleted: ${{ steps.changes.outputs.module_deleted }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

        # Checks for changes in the 'compiled' and 'src' directories
        # We also check for deleted files so we can cleanup the compiled directory
      - name: Collect Changes for Upcoming Jobs
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          list-files: shell
          filters: |
            compiled:
              - 'compiled/**'
            src:
              - 'src/**/*.(ps1|psm1)'
            src_deleted:
              - deleted: 'src/**/*.(ps1|psm1)'
            module:
              - 'src/AMT.PowerShell.Common/**'
            module_deleted:
              - deleted: 'src/AMT.PowerShell.Common/**'

  cleanup-directory:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src_deleted == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Delete Compiled versions of deleted files
        id: delete_files
        run: ./utils/clean-compiled.sh

      - name: Commit Changes
        if: ${{ steps.delete_files.outputs.FOUND_DELETED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(compiled): Remove compiled versions of deleted files"

  build:
    uses: ./.github/workflows/build.yaml

  compile-scripts:
    runs-on: windows-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.module == 'true' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup DotNet
        uses: actions/setup-dotnet@v4
        with:
          cache: true
          dotnet-version: 10.0.x

      - name: Download Compiler Artifact
        uses: actions/download-artifact@v4
        with:
          name: Compiler
          path: /tmp/Compiler

      - name: Run Compiler
        shell: pwsh
        run: /tmp/Compiler/Compiler.exe --input src --output compiled --force -vvv -f

      - name: Commit Changes
        if: ${{ github.event_name == 'workflow_dispatch' || (needs.changes.outputs.src == 'true' || needs.changes.outputs.module == 'true') && github.event_name == 'push' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(compiled): Compile scripts"
